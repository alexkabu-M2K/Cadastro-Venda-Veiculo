<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda seu carro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="conteiner">
        <div class="header">
            <h3>Cadastre seu veículo para vender mais rápido!</h3>
        </div>
        <div class="form-conteiner">
            <div class="form-header">
                <p>Formulário</p>
            </div>
            <div class="form-body">
                <h1 class="form-title">Venda fácil seu Carro!</h1>
                <p>
                    Descreva as caracteristicas do seu veículo e marque os opcionais inclusos
                </p>
                <form>

                    <!-- Texto do Anuncio -->

                    <div class="box-input">
                        <label for="title">Título do anúncio <span class="required-field">*</span></label>
                        <input type="text" name="title" id="title" class="block" placeholder="Um titulo para o anúncio"
                            minlength="1" maxlength="30" required />
                    </div>

                    <!-- Imagem do Veículo -->

                    <div class="box-input">
                        <label for="price">Valor do Veículo <span class="required-field">*</span></label>
                        <input type="number" name="price" id="price" class="block"
                            placeholder="Defina o valor do veículo" required />
                    </div>

                    <!-- Descrição do Veículo -->

                    <div class="box-input">
                        <label for="description">Descrição do Veículo <span class="required-field">*</span></label>
                        <textarea name="description" id="description" class="block"
                            placeholder="Descreva as características do seu veículo" required>
                        </textarea>
                    </div>

                    <!-- Marca e Modelo do Veículo -->
                    <div class="box-input">
                        <label for="brand">Marca do Veículo <span class="required-field">*</span></label>
                        <input type="text" name="brand" id="brand" class="block" placeholder="Marca do veículo"
                            required />
                    </div>

                    <div class="box-input">
                        <label for="model">Modelo do Veículo <span class="required-field">*</span></label>
                        <input type="text" name="model" id="model" class="block" placeholder="Modelo do veículo"
                            required />
                    </div>

                    <!-- Kilometragem do Veículo -->
                    <div class="box-input">
                        <label for="mileage">Kilometragem do Veículo <span class="required-field">*</span></label>
                        <input type="number" name="mileage" id="mileage" class="block"
                            placeholder="Kilometragem do veículo" required />
                    </div>

                    <!-- Data de compra do Veículo -->
                    <div class="box-input">
                        <label for="purchase_date">Data de compra do Veículo <span
                                class="required-field">*</span></label>
                        <input type="data" name="purchase_date" id="purchase_date" class="block"
                            placeholder="Data de aquisição" required />
                    </div>

                    <!-- Tipo de Câmbio do Veiculo -->

                    <div class="box-input">
                        <label for="transmission">Tipo de Câmbio do Veículo <span
                                class="required-field">*</span></label>
                        <select name="transmission" id="transmission" class="block" required>
                            <option value="">Selecione o tipo de câmbio</option>
                            <option value="manual">Manual</option>
                            <option value="automatic">Automático</option>
                        </select>
                    </div>

                    <!-- Tipo de Opcionais (1) do Veículo -->

                    <div class="optional-box">
                        <p>Opcionais do Veículo</p>
                        <br>
                        <ul class="optional-list">
                            <li>
                                <input type="checkbox" id="airbags" name="optional[]" value="airbags">
                                <label for="airbags">Airbags</label>
                            </li>

                            <li>
                                <input type="checkbox" id="alarm" name="optional[]" value="alarm">
                                <label for="alarm">Alarme</label>
                            </li>

                            <li>
                                <input type="checkbox" id="ac" name="optional[]" value="ac">
                                <label for="ac">Ar Condicionado</label>
                            </li>

                            <li>
                                <input type="checkbox" id="reverse_camera" name="optional[]" value="reverse_camera">
                                <label for="reverse_camera">Camera de Ré</label>
                            </li>
                        </ul>
                    </div>

                    <!-- Tipo de Opcionais (2) do Veículo -->

                    <div class="optional-box">

                        <ul class="optional-list">
                            <li>
                                <input type="checkbox" id="lane_assist" name="optional[]" value="lane_assist">
                                <label for="lane_assist">Assistente de Pista</label>
                            </li>

                            <li>
                                <input type="checkbox" id="keyless" name="optional[]" value="keyless">
                                <label for="keyless">Partida sem Chave</label>
                            </li>

                            <li>
                                <input type="checkbox" id="smartphone" name="optional[]" value="smartphone">
                                <label for="smartphone">Integração com Smartphone</label>
                            </li>

                            <li>
                                <input type="checkbox" id="leather_seat" name="optional[]" value="leather_seat">
                                <label for="leather_seat">Banco de Couro</label>
                            </li>
                        </ul>
                    </div>

                    <div class="box-input">
                        <label for="images">Fotos do carro: <span class="required-field">*</span></label>
                        <input type="file" multiple accept="image/png, image/jpg" id="images" name="images" required />
                    </div>
                    <br>
                    <input type="submit" value="Enviar" class="btn-submit" />
                </form>
            </div>
        </div>
    </div>
</body>

</html>
